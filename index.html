<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iOS SMS Interface - 1 to 1</title>
    <style>
        :root {
            --ios-bg: #000000;
            --ios-gray-bubble: #262628;
            --ios-green-bubble: #34C759;
            --ios-blur-bg: rgba(15, 15, 15, 0.75);
            --ios-text-primary: #ffffff;
            --ios-text-secondary: #8e8e93;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; 
        }

        html, body {
            background-color: var(--ios-bg);
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            overflow: hidden;
            color: var(--ios-text-primary);
        }

        .app-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* --- Шапка --- */
        .header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px 20px 16px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        /* Более прозрачный градиент и блюр */
        .header::before {
            content: "";
            position: absolute;
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: -20px; 
            /* Снижена непрозрачность для лучшей видимости текста под шапкой */
            background: linear-gradient(to bottom, rgba(0,0,0,0.80) 10%, rgba(0,0,0,0.3) 60%, transparent 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
            z-index: -1;
            pointer-events: none;
        }

        .back-btn-container {
            display: flex;
            align-items: center;
            flex: 1;
            padding-top: 10px;
        }

        .back-pill {
            background-color: #2c2c2e;
            border-radius: 18px;
            padding: 4px 12px 4px 6px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .back-pill svg {
            fill: var(--ios-text-primary);
            width: 18px;
            height: 18px;
        }

        .back-pill span {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: -0.4px;
        }

        .profile-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        /* АВАТАР */
        .avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(180deg, #6b6388 0%, #312e3e 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.4); 
        }

        .avatar svg {
            fill: #e5e5ea;
            width: 48px;
            height: 48px;
            margin-top: 10px;
        }

        /* ПЛАШКА ДЛЯ ИМЕНИ (Закрашенная и заблюренная, как на скриншоте) */
        .contact-name-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            
            /* Фон, блюр и рамка */
            background-color: rgba(40, 40, 44, 0.7); 
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            backdrop-filter: blur(25px) saturate(150%);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            
            border-radius: 20px;
            padding: 5px 8px 5px 12px;
        }

        .contact-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--ios-text-primary);
            letter-spacing: 0.3px;
        }

        .contact-name-container svg {
            fill: rgba(235, 235, 245, 0.6); /* Полупрозрачная стрелочка */
            width: 14px;
            height: 14px;
        }

        .header-right {
            flex: 1;
        }

        /* --- Область чата --- */
        .chat-area {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            background-color: transparent;
            padding: calc(env(safe-area-inset-top, 0px) + 160px) 16px calc(env(safe-area-inset-bottom, 0px) + 90px) 16px;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; 
            scroll-behavior: smooth;
            z-index: 10;
        }

        .chat-area::-webkit-scrollbar {
            display: none;
        }

        .system-date {
            text-align: center;
            margin: 24px 0 16px 0;
            width: 100%;
            color: var(--ios-text-secondary);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: -0.1px;
        }

        /* --- Пузыри сообщений --- */
        .message-row {
            display: flex;
            width: 100%;
            margin-bottom: 4px;
            position: relative;
        }

        .message-row.sent {
            justify-content: flex-end;
        }

        .message-row.received {
            justify-content: flex-start;
        }

        .message-bubble {
            position: relative;
            padding: 9px 15px;
            font-size: 17px;
            line-height: 1.35;
            max-width: 78%;
            word-wrap: break-word;
            letter-spacing: -0.2px;
            border-radius: 18px;
        }

        .message-content {
            position: relative;
            z-index: 2;
        }

        .sent .message-bubble {
            background-color: var(--ios-green-bubble);
            color: var(--ios-text-primary);
        }
        .sent .message-bubble::before {
            content: "";
            position: absolute;
            z-index: 0;
            bottom: 0;
            right: -8px;
            height: 20px;
            width: 20px;
            background: var(--ios-green-bubble);
            border-bottom-left-radius: 15px;
        }
        .sent .message-bubble::after {
            content: "";
            position: absolute;
            z-index: 1;
            bottom: 0;
            right: -10px;
            width: 10px;
            height: 20px;
            background: var(--ios-bg);
            border-bottom-left-radius: 10px;
        }

        .received .message-bubble {
            background-color: var(--ios-gray-bubble);
            color: var(--ios-text-primary);
        }
        .received .message-bubble::before {
            content: "";
            position: absolute;
            z-index: 0;
            bottom: 0;
            left: -8px;
            height: 20px;
            width: 20px;
            background: var(--ios-gray-bubble);
            border-bottom-right-radius: 15px;
        }
        .received .message-bubble::after {
            content: "";
            position: absolute;
            z-index: 1;
            bottom: 0;
            left: -10px;
            width: 10px;
            height: 20px;
            background: var(--ios-bg);
            border-bottom-right-radius: 10px;
        }

        .message-bubble p {
            margin-bottom: 14px; 
        }
        .message-bubble p:last-child {
            margin-bottom: 0;
        }

        /* --- Нижняя панель ввода --- */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--ios-blur-bg);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            backdrop-filter: blur(30px) saturate(180%);
            padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 12px) 12px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            z-index: 100;
        }

        .add-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #2c2c2e;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .add-btn svg {
            fill: var(--ios-text-secondary);
            width: 20px;
            height: 20px;
        }

        .input-wrapper {
            flex: 1;
            background-color: #1c1c1e;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 4px 12px 6px 12px;
            border: 0.5px solid rgba(255,255,255,0.05);
        }

        .input-theme {
            padding: 4px 0;
            border-bottom: 0.5px solid #3a3a3c;
        }
        
        .input-theme input {
            background: transparent;
            border: none;
            color: var(--ios-text-primary);
            font-size: 16px;
            outline: none;
            width: 100%;
        }
        .input-theme input::placeholder { color: var(--ios-text-secondary); }

        .input-message-row {
            display: flex;
            align-items: center;
            padding-top: 4px;
        }

        .input-message-row input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--ios-text-primary);
            font-size: 16px;
            outline: none;
            min-width: 0;
        }
        .input-message-row input::placeholder { color: var(--ios-text-secondary); }

        .mic-btn {
            background: transparent;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding-left: 8px;
            width: 26px;
            height: 26px;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- Шапка -->
    <div class="header">
        <div class="back-btn-container">
            <div class="back-pill">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                <span>89</span>
            </div>
        </div>
        <div class="profile-center">
            <div class="avatar">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <!-- Плашка для имени "4000" -->
            <div class="contact-name-container">
                <div class="contact-name">4000</div>
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </div>
        </div>
        <div class="header-right"></div>
    </div>

    <!-- Чат -->
    <div class="chat-area" id="chatArea"></div>

    <!-- Зона ввода -->
    <div class="input-area">
        <div class="add-btn">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </div>
        
        <div class="input-wrapper">
            <div class="input-theme">
                <input type="text" placeholder="Betreff" disabled>
            </div>
            <div class="input-message-row">
                <input type="text" inputmode="numeric" id="messageInput" placeholder="Textnachricht • SMS" autocomplete="off">
                <button class="mic-btn" id="actionBtn">
                    <svg viewBox="0 0 24 24" style="fill: #8e8e93; width: 16px; height: 20px;"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </button>
            </div>
        </div>
    </div>

</div>

<script>
    const chatArea = document.getElementById('chatArea');
    const messageInput = document.getElementById('messageInput');
    const actionBtn = document.getElementById('actionBtn');
    
    const STORAGE_KEY = 'ios_sms_history_rtec_v5'; 
    
    const defaultHistory = [
        { type: 'received', text: '<p>Codul este greșit.</p>', date: '2026-07-29T07:54:00.000Z' },
        { type: 'system', text: '', date: '2026-07-29T07:56:00.000Z' },
        { type: 'sent', text: '<p>3889</p>', date: '2026-07-29T07:56:01.000Z' },
        { type: 'received', text: '<p>IM RTEC</p><p>Bilet Nr MCT-000350392</p><p>29.07.2026 07:56</p><p>Pret 7 MDL</p><p>Bord 3889</p>', date: '2026-07-29T07:56:05.000Z' },
        { type: 'system', text: '', date: '2026-08-01T14:32:00.000Z' },
        { type: 'sent', text: '<p>3600</p>', date: '2026-08-01T14:32:01.000Z' },
        { type: 'received', text: '<p>IM RTEC</p><p>Bilet Nr MCT-000353043</p><p>01.08.2026 14:32</p><p>Pret 7 MDL</p><p>Bord 3600</p>', date: '2026-08-01T14:32:05.000Z' }
    ];

    let chatHistory = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!chatHistory || chatHistory.length === 0) {
        chatHistory = defaultHistory;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
    }

    const micSvg = `<svg viewBox="0 0 24 24" style="fill: #8e8e93; width: 16px; height: 20px;"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>`;
    const sendSvg = `<svg width="26" height="26" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg"><circle cx="13" cy="13" r="13" fill="#34C759"/><path d="M13 7 L8 12 L9.4 13.4 L12 10.8 V18 H14 V10.8 L16.6 13.4 L18 12 Z" fill="#FFFFFF"/></svg>`;

    const shortDays = ['So.', 'Mo.', 'Di.', 'Mi.', 'Do.', 'Fr.', 'Sa.'];
    const shortMonths = ['Jan.', 'Feb.', 'März', 'Apr.', 'Mai', 'Juni', 'Juli', 'Aug.', 'Sept.', 'Okt.', 'Nov.', 'Dez.'];

    function formatSystemDate(dateStr) {
        const d = new Date(dateStr);
        const dayName = shortDays[d.getDay()];
        const day = d.getDate();
        const month = shortMonths[d.getMonth()];
        const hours = String(d.getHours()).padStart(2, '0');
        const mins = String(d.getMinutes()).padStart(2, '0');
        return `${dayName} ${day}. ${month}, ${hours}:${mins}`;
    }

    function formatTicketDate(dateStr) {
        const d = new Date(dateStr);
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yyyy = d.getFullYear();
        const hours = String(d.getHours()).padStart(2, '0');
        const mins = String(d.getMinutes()).padStart(2, '0');
        return `${dd}.${mm}.${yyyy} ${hours}:${mins}`;
    }

    function scrollToBottom() {
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function renderHistory() {
        chatArea.innerHTML = '';
        chatHistory.forEach(msg => {
            if (msg.type === 'system') {
                renderSystemDate(msg.date);
            } else {
                renderBubble(msg.text, msg.type);
            }
        });
        
        setTimeout(() => {
            if (chatArea.scrollHeight > chatArea.clientHeight) {
                chatArea.scrollTop = 50; 
            }
        }, 100);
    }

    function renderSystemDate(dateStr) {
        const systemDiv = document.createElement('div');
        systemDiv.className = 'system-date';
        systemDiv.innerText = formatSystemDate(dateStr);
        chatArea.appendChild(systemDiv);
    }

    function renderBubble(htmlContent, type) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message-row ${type}`;
        msgDiv.innerHTML = `<div class="message-bubble"><div class="message-content">${htmlContent}</div></div>`;
        chatArea.appendChild(msgDiv);
    }

    function saveMessage(type, text, dateStr) {
        chatHistory.push({ type, text, date: dateStr });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
    }

    function checkAndAddSystemDate(now) {
        if (chatHistory.length === 0) {
            saveMessage('system', '', now.toISOString());
            renderSystemDate(now.toISOString());
            return;
        }
        
        const lastMsg = chatHistory[chatHistory.length - 1];
        const lastDate = new Date(lastMsg.date);
        const diffHours = (now - lastDate) / (1000 * 60 * 60);
        
        if (diffHours > 2) {
            saveMessage('system', '', now.toISOString());
            renderSystemDate(now.toISOString());
        }
    }

    function handleSend() {
        const rawText = messageInput.value.trim();
        if (!rawText) return;

        const text = `<p>${rawText}</p>`;
        const now = new Date();
        checkAndAddSystemDate(now);

        renderBubble(text, 'sent');
        saveMessage('sent', text, now.toISOString());
        
        messageInput.value = '';
        actionBtn.innerHTML = micSvg;
        messageInput.focus();
        scrollToBottom();

        setTimeout(() => {
            const replyNow = new Date();
            const randomNum = Math.floor(100000 + Math.random() * 900000);
            const ticketNumber = `MCT-000${randomNum}`;
            const dateTimeStr = formatTicketDate(replyNow.toISOString());

            const replyHtml = `
                <p>IM RTEC</p>
                <p>Bilet Nr ${ticketNumber}</p>
                <p>${dateTimeStr}</p>
                <p>Pret 7 MDL</p>
                <p>Bord ${rawText}</p>
            `;

            renderBubble(replyHtml, 'received');
            saveMessage('received', replyHtml, replyNow.toISOString());
            scrollToBottom();
        }, 600);
    }

    messageInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            handleSend();
        }
    });

    messageInput.addEventListener('input', function() {
        if (this.value.trim().length > 0) {
            actionBtn.innerHTML = sendSvg;
        } else {
            actionBtn.innerHTML = micSvg;
        }
    });

    actionBtn.addEventListener('click', function() {
        if (messageInput.value.trim().length > 0) {
            handleSend();
        }
    });

    renderHistory();
</script>
</body>
</html>
